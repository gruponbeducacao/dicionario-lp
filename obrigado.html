<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário Contábil — Fluência Contábil</title>

<!--
  Esta página era o fim do funil gratuito: quem deixava o e-mail caía aqui e
  baixava o Dicionário inteiro. O produto passou a ser vendido, o formulário
  saiu do ar e o PDF saiu da raiz — mas o endereço continua circulando em
  link compartilhado e no índice do Google.

  Então ela não é apagada, é redirecionada: um 404 jogaria fora tráfego que
  já chega procurando exatamente este material. Quem vier pelo caminho antigo
  encontra a oferta, e ninguém encontra o arquivo.

  O redirect é imediato; o texto abaixo só aparece se o JS estiver desligado.
-->
<meta http-equiv="refresh" content="0; url=/">
<link rel="canonical" href="https://dicionario.fluenciacontabil.com.br/">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="favicon.png">

<style>
  :root {
    --navy: #1B2A4A;
    --dourado: #C8A84B;
    --cream: #FBF6E9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--cream);
    color: var(--navy);
    font-family: Montserrat, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    text-align: center;
  }
  .caixa { max-width: 30rem; }
  img { width: 132px; height: auto; margin-bottom: 28px; }
  h1 { font-size: 1.35rem; line-height: 1.4; margin: 0 0 12px; font-weight: 700; }
  p { font-size: 1rem; line-height: 1.65; margin: 0 0 24px; color: #4A5568; }
  a.btn {
    display: inline-block;
    background: var(--dourado);
    color: var(--navy);
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    padding: 14px 30px;
    border-radius: 8px;
  }
  a.btn:hover { filter: brightness(1.06); }
</style>
</head>
<body>
  <div class="caixa">
    <img src="logo.png" alt="Fluência Contábil">
    <h1>Esta página mudou de endereço</h1>
    <p>O Dicionário Contábil agora tem uma página própria, com a edição 2026 completa.</p>
    <a class="btn" href="/">Ver o Dicionário Contábil</a>
  </div>
  <script>window.location.replace('/');</script>
</body>
</html>
